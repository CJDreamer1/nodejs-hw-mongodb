type: object
required:
  - _id
  - name
  - phoneNumber
  - email
  - isFavourite
  - contactType
  - photo
properties:
  _id:
    description: 'Contact id'
    type: string
    example: 66bb5f9359270656b4e3daef
  name:
    description: 'Name of contact'
    type: string
    example: 'John Doe'
  phoneNumber:
    description: 'Phone number of contact'
    type: string
    example: +380123456789
  email:
    description: 'Email of contact'
    type: string
    example: 'jonhdoe@gmail.com'
  isFavourite:
    description: 'Whether contact is favourite '
    type: boolean
    example: false
    default: false
  contactType:
    description: 'Type of contact'
    type: string
    enum: ['work', 'home', 'personal']
    example: work
  photo:
    description: 'Photo of contact'
    type: string
