tags:
  - Contacts
summary: Patch contact
operationId: patchContactWithAvatar
description: 'Update contact with photo'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
    example: 66bb5f9359270656b4e3daef
requestBody:
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            description: 'Name of contact'
            type: string
            example: 'John Doe'
          phoneNumber:
            description: 'Phone number of contact'
            type: string
            example: +380123456789
          email:
            description: 'Email of contact'
            type: string
            example: 'jonhdoe@gmail.com'
          contactType:
            description: 'Type of contact'
            type: string
            enum: ['work', 'home', 'personal']
            example: work
          photo:
            description: 'User`s photo'
            type: string
responses:
  '200':
    $ref: ../../../components/responses/200.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
